<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brisk Academy · Credit craft for stronger businesses</title>
<meta name="description" content="Brisk Academy staff learning broadcast: our values, the AGF standard, and the 5 Cs of Credit applied the Brisk way." />
<meta name="theme-color" content="#F86818" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Brisk Credit Ltd" />
<meta property="og:title" content="Brisk Academy · Think like a lender. Build like a partner." />
<meta property="og:description" content="A bright, practical learning broadcast for confident credit decisions." />
<meta property="og:url" content="https://alexmureti.github.io/brisk-ads/academy.html" />
<meta property="og:image" content="https://alexmureti.github.io/brisk-ads/academy-og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="preload" href="academy-hero.webp" as="image" type="image/webp" />
<style>
  :root {
    --orange: #F86818;
    --blue: #2098F0;
    --green: #37B24D;
    --gold: #FFB45A;
    --black: #111111;
    --charcoal: #282828;
    --white: #FFFFFF;
    --soft-blue: #ECF8FF;
    --soft-orange: #FFF1E8;
    --soft-green: #EAF8ED;
    --soft-gold: #FFF5DF;
    --line: #DDE8EE;
    --accent: var(--orange);
    --font: "Manrope", "Segoe UI", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--white);
  }

  body {
    color: var(--black);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  a {
    font: inherit;
  }

  button {
    color: inherit;
  }

  .top-progress {
    position: fixed;
    inset: 0 auto auto 0;
    z-index: 40;
    width: 0;
    height: 5px;
    background: var(--accent);
    transition: background-color 420ms ease;
  }

  .chrome {
    position: fixed;
    inset: 0 0 auto;
    z-index: 30;
    height: 86px;
    display: grid;
    grid-template-columns: minmax(230px, 1fr) auto minmax(230px, 1fr);
    align-items: center;
    gap: 24px;
    padding: 0 clamp(24px, 4vw, 72px);
    background: var(--white);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    text-decoration: none;
  }

  .brand img {
    display: block;
    width: clamp(154px, 13vw, 205px);
    height: auto;
  }

  .module {
    min-width: 0;
    text-align: center;
  }

  .module strong {
    display: block;
    font-size: clamp(13px, 1.15vw, 17px);
    font-weight: 800;
    letter-spacing: .055em;
  }

  .module span {
    display: block;
    margin-top: 4px;
    color: #555;
    font-size: clamp(10px, .9vw, 13px);
    font-weight: 600;
  }

  .tools {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .clock {
    min-width: 76px;
    margin-right: 4px;
    text-align: right;
  }

  .clock strong {
    display: block;
    font-size: 17px;
    line-height: 1;
  }

  .clock span {
    display: block;
    margin-top: 5px;
    color: #666;
    font-size: 10px;
    font-weight: 700;
  }

  .tool-button {
    min-width: 74px;
    padding: 9px 12px;
    border: 1px solid var(--black);
    border-radius: 999px;
    background: var(--white);
    cursor: pointer;
    font-size: 11px;
    font-weight: 800;
    transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
  }

  .tool-button:hover,
  .tool-button:focus-visible {
    background: var(--black);
    color: var(--white);
    outline: none;
    transform: translateY(-1px);
  }

  .stage {
    position: fixed;
    inset: 86px 0 76px;
    overflow: hidden;
    background: var(--white);
  }

  .scene {
    --scene-bg: var(--white);
    --scene-ink: var(--black);
    --scene-accent: var(--orange);
    position: absolute;
    inset: 0;
    visibility: hidden;
    overflow: hidden;
    background: var(--scene-bg);
    color: var(--scene-ink);
    opacity: 0;
    pointer-events: none;
    transform: translateX(32px);
    transition:
      opacity 520ms cubic-bezier(.22, .8, .24, 1),
      transform 520ms cubic-bezier(.22, .8, .24, 1),
      visibility 520ms;
  }

  .scene.is-active {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    transform: none;
  }

  .scene-frame {
    position: relative;
    z-index: 2;
    width: min(1480px, calc(100vw - clamp(48px, 8vw, 152px)));
    height: 100%;
    margin: 0 auto;
  }

  .scene h1,
  .scene h2,
  .scene h3 {
    text-wrap: balance;
  }

  .scene p {
    text-wrap: pretty;
  }

  .scene-kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--black);
    color: var(--white);
    font-size: clamp(10px, .9vw, 13px);
    font-weight: 800;
  }

  .scene-kicker i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--scene-accent);
  }

  .display {
    font-size: clamp(48px, 6.2vw, 94px);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: .98;
  }

  .lead {
    max-width: 58ch;
    font-size: clamp(17px, 1.55vw, 25px);
    font-weight: 500;
    line-height: 1.48;
  }

  .hero {
    background: var(--white);
  }

  .hero-media {
    position: absolute;
    inset: 0;
  }

  .hero-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .hero-copy {
    position: relative;
    z-index: 3;
    width: min(660px, 46vw);
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(18px, 2.4vh, 30px);
  }

  .hero-copy .display {
    max-width: 10ch;
  }

  .hero-copy .lead {
    max-width: 41ch;
    color: #383838;
  }

  .hero-signals {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
  }

  .hero-signals span {
    padding: 8px 12px;
    border: 1px solid var(--black);
    border-radius: 999px;
    background: rgba(255, 255, 255, .88);
    font-size: clamp(10px, .84vw, 12px);
    font-weight: 800;
  }

  .vision-frame {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr);
    align-items: center;
    gap: clamp(28px, 5vw, 86px);
  }

  .vision-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(18px, 2.8vh, 34px);
  }

  .vision-copy .display {
    max-width: 12ch;
  }

  .mission {
    max-width: 620px;
    padding: clamp(18px, 2vw, 28px);
    border-radius: 14px;
    background: var(--white);
    color: var(--black);
  }

  .mission strong {
    display: block;
    margin-bottom: 7px;
    color: var(--orange);
    font-size: 14px;
  }

  .mission p {
    font-size: clamp(16px, 1.35vw, 21px);
    font-weight: 650;
    line-height: 1.42;
  }

  .africa-stage {
    position: relative;
    height: min(66vh, 650px);
    display: grid;
    place-items: center;
  }

  .africa-stage::before {
    position: absolute;
    width: min(35vw, 520px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--white);
    content: "";
  }

  .africa-stage::after {
    position: absolute;
    right: 0;
    bottom: 5%;
    width: 38%;
    height: 15%;
    border-radius: 999px;
    background: var(--orange);
    content: "";
  }

  .africa-stage img {
    position: relative;
    z-index: 2;
    width: min(31vw, 480px);
    max-height: 62vh;
    object-fit: contain;
  }

  .values-frame {
    display: grid;
    grid-template-columns: minmax(290px, .66fr) minmax(0, 1.34fr);
    align-items: center;
    gap: clamp(36px, 6vw, 110px);
  }

  .values-intro {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .values-intro p {
    max-width: 30ch;
    font-size: clamp(17px, 1.45vw, 23px);
    font-weight: 650;
    line-height: 1.45;
  }

  .value-stack {
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1vh, 12px);
  }

  .value-word {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: clamp(29px, 4.1vw, 66px);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1.05;
  }

  .value-word::before {
    flex: 0 0 auto;
    width: clamp(16px, 1.8vw, 28px);
    height: clamp(16px, 1.8vw, 28px);
    border-radius: 50%;
    background: var(--dot);
    content: "";
  }

  .value-word:nth-child(2) {
    margin-left: 9%;
  }

  .value-word:nth-child(3) {
    margin-left: 18%;
  }

  .value-word:nth-child(4) {
    margin-left: 8%;
  }

  .value-word:nth-child(5) {
    margin-left: 24%;
  }

  .partner-frame {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(350px, .92fr);
    align-items: center;
    gap: clamp(40px, 6vw, 100px);
  }

  .partner-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(18px, 2.6vh, 32px);
  }

  .partner-copy .display {
    max-width: 11ch;
  }

  .partner-copy .lead {
    max-width: 43ch;
    color: #3B3B3B;
  }

  .agf-mark {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--blue);
    color: var(--black);
  }

  .agf-mark strong {
    font-size: clamp(90px, 13vw, 210px);
    font-weight: 800;
    letter-spacing: -.07em;
  }

  .agf-mark span {
    position: absolute;
    right: -3%;
    bottom: 8%;
    max-width: 190px;
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--orange);
    font-size: clamp(12px, 1vw, 15px);
    font-weight: 800;
    line-height: 1.35;
  }

  .agf-values-frame {
    display: grid;
    grid-template-rows: auto 1fr;
    align-items: center;
    padding-block: clamp(32px, 5vh, 68px);
  }

  .agf-values-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 30px;
    margin-bottom: clamp(24px, 4vh, 46px);
  }

  .agf-values-head h2 {
    max-width: 11ch;
    font-size: clamp(38px, 5.1vw, 78px);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1;
  }

  .agf-values-head p {
    max-width: 35ch;
    font-size: clamp(15px, 1.25vw, 19px);
    font-weight: 600;
    line-height: 1.5;
  }

  .standards {
    border-top: 2px solid var(--black);
  }

  .standard-row {
    display: grid;
    grid-template-columns: 64px minmax(220px, .7fr) minmax(0, 1.3fr);
    align-items: center;
    gap: clamp(18px, 3vw, 48px);
    min-height: clamp(66px, 8.5vh, 96px);
    border-bottom: 1px solid rgba(17, 17, 17, .42);
  }

  .standard-row b {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--row-color);
    font-size: 13px;
  }

  .standard-row h3 {
    font-size: clamp(18px, 1.55vw, 25px);
    font-weight: 800;
  }

  .standard-row p {
    max-width: 70ch;
    font-size: clamp(13px, 1.05vw, 17px);
    font-weight: 600;
    line-height: 1.42;
  }

  .lens-frame {
    display: grid;
    grid-template-columns: minmax(300px, .65fr) minmax(0, 1.35fr);
    align-items: center;
    gap: clamp(44px, 7vw, 120px);
  }

  .lens-number {
    position: relative;
    display: grid;
    place-items: center;
    width: min(34vw, 490px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--orange);
  }

  .lens-number strong {
    font-size: clamp(160px, 25vw, 380px);
    font-weight: 800;
    letter-spacing: -.09em;
    line-height: .8;
  }

  .lens-number span {
    position: absolute;
    right: -5%;
    bottom: 9%;
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--black);
    color: var(--white);
    font-size: clamp(12px, 1vw, 15px);
    font-weight: 800;
  }

  .lens-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(18px, 2.4vh, 30px);
  }

  .lens-copy .display {
    max-width: 10ch;
  }

  .lens-track {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-top: 2px solid var(--black);
    border-bottom: 2px solid var(--black);
  }

  .lens-track span {
    min-width: 0;
    padding: clamp(12px, 1.5vw, 20px) 8px;
    border-right: 1px solid rgba(17, 17, 17, .35);
    font-size: clamp(10px, .88vw, 13px);
    font-weight: 800;
    text-align: center;
  }

  .lens-track span:last-child {
    border-right: 0;
  }

  .credit-frame {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(390px, .82fr);
    align-items: center;
    gap: clamp(38px, 6vw, 100px);
  }

  .credit-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(14px, 2vh, 24px);
  }

  .credit-step {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(13px, 1.1vw, 17px);
    font-weight: 800;
  }

  .credit-step b {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--scene-accent);
  }

  .credit-title {
    font-size: clamp(48px, 6vw, 92px);
    font-weight: 800;
    letter-spacing: -.038em;
    line-height: .95;
  }

  .credit-definition {
    max-width: 39ch;
    font-size: clamp(20px, 1.75vw, 28px);
    font-weight: 650;
    line-height: 1.38;
  }

  .brisk-way {
    max-width: 660px;
    padding: clamp(18px, 2vw, 26px);
    border-radius: 14px;
    background: var(--black);
    color: var(--white);
  }

  .brisk-way strong {
    display: block;
    margin-bottom: 8px;
    color: var(--scene-accent);
    font-size: 13px;
  }

  .brisk-way p {
    font-size: clamp(14px, 1.18vw, 18px);
    font-weight: 600;
    line-height: 1.48;
  }

  .field-signal {
    color: var(--black);
    font-size: clamp(14px, 1.25vw, 19px);
    font-weight: 800;
  }

  .credit-visual {
    position: relative;
    min-height: min(63vh, 650px);
    overflow: hidden;
    border-radius: 16px;
    background: var(--black);
  }

  .credit-visual img {
    width: 100%;
    height: 100%;
    min-height: min(63vh, 650px);
    display: block;
    object-fit: cover;
  }

  .credit-visual figcaption {
    position: absolute;
    right: 18px;
    bottom: 18px;
    max-width: 250px;
    padding: 12px 15px;
    border-radius: 10px;
    background: var(--scene-accent);
    color: var(--black);
    font-size: clamp(11px, .9vw, 14px);
    font-weight: 800;
    line-height: 1.35;
  }

  .final-frame {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr);
    align-items: center;
    gap: clamp(32px, 5vw, 82px);
  }

  .final-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(18px, 2.5vh, 30px);
  }

  .final-copy .display {
    max-width: 10ch;
  }

  .final-copy .lead {
    max-width: 43ch;
    color: #383838;
  }

  .final-orbit {
    position: relative;
    height: min(64vh, 650px);
  }

  .final-orbit span {
    position: absolute;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--black);
    font-weight: 800;
  }

  .final-orbit span:nth-child(1) {
    top: 5%;
    left: 18%;
    width: 34%;
    aspect-ratio: 1;
    background: var(--blue);
    font-size: clamp(38px, 5vw, 76px);
  }

  .final-orbit span:nth-child(2) {
    top: 27%;
    right: 3%;
    width: 39%;
    aspect-ratio: 1;
    background: var(--orange);
    font-size: clamp(42px, 5.6vw, 84px);
  }

  .final-orbit span:nth-child(3) {
    bottom: 4%;
    right: 18%;
    width: 29%;
    aspect-ratio: 1;
    background: var(--green);
    font-size: clamp(32px, 4.4vw, 68px);
  }

  .final-orbit span:nth-child(4) {
    bottom: 14%;
    left: 3%;
    width: 35%;
    aspect-ratio: 1;
    background: var(--gold);
    font-size: clamp(36px, 4.9vw, 74px);
  }

  .final-orbit span:nth-child(5) {
    top: 38%;
    left: 31%;
    z-index: 2;
    width: 26%;
    aspect-ratio: 1;
    background: var(--white);
    border: 3px solid var(--black);
    font-size: clamp(28px, 3.8vw, 58px);
  }

  .footer {
    position: fixed;
    inset: auto 0 0;
    z-index: 30;
    height: 76px;
    display: grid;
    grid-template-columns: minmax(300px, 1fr) auto minmax(300px, 1fr);
    align-items: center;
    gap: 24px;
    padding: 0 clamp(24px, 4vw, 72px);
    background: var(--black);
    color: var(--white);
  }

  .footer::before {
    position: absolute;
    inset: 0 auto 0 0;
    width: 9px;
    background: var(--accent);
    content: "";
    transition: background-color 420ms ease;
  }

  .footer-status strong {
    display: block;
    font-size: 13px;
  }

  .footer-status span {
    display: block;
    margin-top: 3px;
    color: #C8C8C8;
    font-size: 10px;
    font-weight: 650;
  }

  .progress-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .progress-nav button {
    width: 48px;
    height: 7px;
    overflow: hidden;
    border: 0;
    border-radius: 999px;
    background: #666;
    color: transparent;
    cursor: pointer;
    transform: scaleX(.5);
    transition: transform 220ms ease, background-color 220ms ease;
  }

  .progress-nav button.is-active {
    background: var(--dot);
    transform: scaleX(1);
  }

  .progress-nav button:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 4px;
  }

  .footer-contact {
    color: #D7D7D7;
    font-size: clamp(9px, .72vw, 11px);
    font-weight: 650;
    line-height: 1.45;
    text-align: right;
  }

  .footer-contact b {
    color: var(--white);
  }

  .scene.is-active .scene-kicker,
  .scene.is-active .display,
  .scene.is-active .lead,
  .scene.is-active .hero-signals,
  .scene.is-active .mission,
  .scene.is-active .value-stack,
  .scene.is-active .agf-mark,
  .scene.is-active .standards,
  .scene.is-active .lens-number,
  .scene.is-active .lens-track,
  .scene.is-active .credit-visual,
  .scene.is-active .brisk-way,
  .scene.is-active .final-orbit {
    animation: enter 680ms cubic-bezier(.16, .84, .24, 1) both;
  }

  .scene.is-active .display,
  .scene.is-active .mission,
  .scene.is-active .value-stack,
  .scene.is-active .standards,
  .scene.is-active .lens-track,
  .scene.is-active .brisk-way,
  .scene.is-active .final-orbit {
    animation-delay: 110ms;
  }

  .scene.is-active .lead,
  .scene.is-active .hero-signals,
  .scene.is-active .credit-visual {
    animation-delay: 220ms;
  }

  @keyframes enter {
    from {
      opacity: 0;
      transform: translateY(22px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  @media (max-width: 1000px), (max-aspect-ratio: 4/3) {
    .chrome {
      grid-template-columns: 1fr auto;
    }

    .module {
      display: none;
    }

    .stage {
      bottom: 70px;
    }

    .footer {
      height: 70px;
      grid-template-columns: 1fr auto;
    }

    .footer-contact {
      display: none;
    }

    .scene-frame {
      width: min(92vw, 760px);
    }

    .hero-media img {
      object-position: 64% center;
      opacity: .36;
    }

    .hero-copy {
      width: 92%;
    }

    .vision-frame,
    .values-frame,
    .partner-frame,
    .lens-frame,
    .credit-frame,
    .final-frame {
      grid-template-columns: 1fr;
      align-content: center;
      gap: 28px;
      padding-block: 28px;
    }

    .africa-stage,
    .agf-mark,
    .lens-number,
    .credit-visual,
    .final-orbit {
      display: none;
    }

    .value-word:nth-child(n) {
      margin-left: 0;
    }

    .agf-values-head {
      align-items: start;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .standard-row {
      grid-template-columns: 44px minmax(150px, .7fr) minmax(0, 1.3fr);
      min-height: 58px;
    }

    .lens-track {
      grid-template-columns: 1fr;
    }

    .lens-track span {
      border-right: 0;
      border-bottom: 1px solid rgba(17, 17, 17, .28);
      text-align: left;
    }

    .lens-track span:last-child {
      border-bottom: 0;
    }
  }

  @media (max-width: 680px) {
    .chrome {
      height: 72px;
      padding-inline: 18px;
    }

    .brand img {
      width: 140px;
    }

    .clock,
    #fullscreenButton {
      display: none;
    }

    .stage {
      inset: 72px 0 62px;
    }

    .footer {
      height: 62px;
      grid-template-columns: 1fr;
      padding-inline: 18px;
    }

    .footer-status {
      display: none;
    }

    .progress-nav {
      gap: 4px;
    }

    .progress-nav button {
      width: 22px;
      height: 6px;
      transform: scaleX(.5);
    }

    .progress-nav button.is-active {
      transform: scaleX(1);
    }

    .display {
      font-size: clamp(40px, 13vw, 66px);
    }

    .lead {
      font-size: 16px;
    }

    .standard-row {
      grid-template-columns: 38px 1fr;
      gap: 10px;
    }

    .standard-row p {
      display: none;
    }

    .credit-title {
      font-size: clamp(44px, 14vw, 68px);
    }

    .credit-definition {
      font-size: 18px;
    }
  }

  @media (max-height: 720px) and (min-width: 1001px) {
    .chrome {
      height: 72px;
    }

    .stage {
      inset: 72px 0 64px;
    }

    .footer {
      height: 64px;
    }

    .credit-visual,
    .credit-visual img {
      min-height: 56vh;
    }

    .scene-frame {
      width: min(1400px, 91vw);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="top-progress" id="topProgress" aria-hidden="true"></div>

  <header class="chrome">
    <a class="brand" href="index.html" aria-label="Brisk Credit screens home">
      <img src="brisk-logo.png" alt="Brisk Credit Ltd" />
    </a>

    <div class="module">
      <strong>BRISK ACADEMY</strong>
      <span id="moduleName">Credit craft · Module 01</span>
    </div>

    <div class="tools">
      <div class="clock" aria-label="Current time and date">
        <strong id="clockTime">--:--</strong>
        <span id="clockDate">—</span>
      </div>
      <button class="tool-button" id="pauseButton" type="button" aria-pressed="false">Pause</button>
      <button class="tool-button" id="fullscreenButton" type="button">Fullscreen</button>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer class="footer">
    <div class="footer-status">
      <strong id="chapterName">Start here</strong>
      <span><b id="sceneCount">01 / 12</b> · Arrow keys to explore · Space to pause</span>
    </div>

    <nav class="progress-nav" id="progressNav" aria-label="Academy scenes"></nav>

    <div class="footer-contact">
      <b>+254 713 329 268</b> · Paybill <b>4106969</b><br />
      Central Bank of Kenya regulated
    </div>
  </footer>

<script>
  const BRISK_VALUES = [
    { name: "Team Work", color: "var(--blue)" },
    { name: "Integrity", color: "var(--white)" },
    { name: "Transformation", color: "var(--green)" },
    { name: "Innovation", color: "var(--blue)" },
    { name: "Excellence", color: "var(--gold)" }
  ];

  const AGF_VALUES = [
    {
      name: "Integrity",
      description: "Honest, trustworthy, reliable, transparent and accountable in every dealing.",
      color: "var(--orange)"
    },
    {
      name: "Customer First",
      description: "We meet our internal and external customers’ expectations—always.",
      color: "var(--green)"
    },
    {
      name: "Creativity",
      description: "We embrace new ideas and respond swiftly to a changing market.",
      color: "var(--gold)"
    },
    {
      name: "Unity of Purpose",
      description: "We dedicate ourselves to pursuing agreed, common goals together.",
      color: "var(--orange)"
    },
    {
      name: "Right First Time",
      description: "We deliver on our commitments accurately and promptly.",
      color: "var(--green)"
    }
  ];

  const CREDIT_CS = [
    {
      name: "Character",
      accent: "#2098F0",
      tint: "#ECF8FF",
      image: "c-character.png",
      definition: "Will they repay? Read the borrower’s track record, reputation and honesty.",
      brisk: "We confirm character through CRB checks, repayment history and witnesses who personally know the client and the business.",
      signal: "95.84% repayment rate—character pays."
    },
    {
      name: "Capacity",
      accent: "#37B24D",
      tint: "#EAF8ED",
      image: "c-capacity.png",
      definition: "Can they repay? Understand the cash flow and income available to service the loan.",
      brisk: "Our R.O.s visit the business, observe daily takings and size the loan to real cash flow—never beyond what the business can carry.",
      signal: "KES 5,000–100,000, matched to the business."
    },
    {
      name: "Capital",
      accent: "#FFB45A",
      tint: "#FFF5DF",
      image: "c-capital.png",
      definition: "What have they invested? Look for the borrower’s own stake in the venture.",
      brisk: "A client with capital in stock, tools or land has skin in the game—and more reason to protect the business and keep repaying.",
      signal: "Own contribution means shared commitment."
    },
    {
      name: "Collateral",
      accent: "#F86818",
      tint: "#FFF1E8",
      image: "c-collateral.png",
      definition: "What backs the loan? Identify the security or relationship the lender can rely on.",
      brisk: "Brisk lends largely unsecured, so relationship is security: paired R.O.s, witnesses, group standing and M-PESA verification.",
      signal: "Relationship is our security."
    },
    {
      name: "Conditions",
      accent: "#2098F0",
      tint: "#F3FBFF",
      image: "c-conditions.png",
      definition: "What is the context? Consider purpose, terms, season and the wider economy.",
      brisk: "We weigh the purpose, season and market conditions—lending for productive use that grows the client’s wealth.",
      signal: "Right loan. Right purpose. Right time."
    }
  ];

  const scenes = [
    {
      chapter: "Start here",
      accent: "#F86818",
      background: "#FFFFFF",
      duration: 9000,
      className: "hero",
      html: `
        <div class="hero-media">
          <img src="academy-hero.webp" alt="Kenyan entrepreneur and credit professional reviewing business performance together" />
        </div>
        <div class="scene-frame">
          <div class="hero-copy">
            <span class="scene-kicker"><i></i> Credit craft · Module 01</span>
            <h1 class="display">Sharper decisions. Stronger businesses.</h1>
            <p class="lead">Think like a lender. Build like a partner. Apply the Brisk way with confidence.</p>
            <div class="hero-signals" aria-label="Module outcomes">
              <span>Read the business</span>
              <span>Protect the portfolio</span>
              <span>Grow customer wealth</span>
            </div>
          </div>
        </div>`
    },
    {
      chapter: "Our ambition",
      accent: "#F86818",
      background: "#2098F0",
      duration: 9000,
      className: "vision",
      html: `
        <div class="scene-frame vision-frame">
          <div class="vision-copy">
            <span class="scene-kicker"><i></i> The future we are building</span>
            <h2 class="display">Africa’s most valued digital financial partner.</h2>
            <div class="mission">
              <strong>OUR MISSION</strong>
              <p>Provide customers with superior financial solutions that grow their wealth.</p>
            </div>
          </div>
          <figure class="africa-stage">
            <img src="brisk-mark.png" alt="Brisk client in an Africa-shaped frame" />
          </figure>
        </div>`
    },
    {
      chapter: "How we show up",
      accent: "#2098F0",
      background: "#F86818",
      duration: 9000,
      className: "values",
      html: `
        <div class="scene-frame values-frame">
          <div class="values-intro">
            <span class="scene-kicker"><i></i> Brisk core values</span>
            <h2 class="display">Standards you can see.</h2>
            <p>Values matter when they shape the next customer conversation, credit decision and colleague interaction.</p>
          </div>
          <div class="value-stack">
            ${BRISK_VALUES.map(value => `
              <div class="value-word" style="--dot:${value.color}">${value.name}</div>
            `).join("")}
          </div>
        </div>`
    },
    {
      chapter: "Our guarantee partner",
      accent: "#F86818",
      background: "#FFFFFF",
      duration: 9000,
      className: "partner",
      html: `
        <div class="scene-frame partner-frame">
          <div class="partner-copy">
            <span class="scene-kicker"><i></i> African Guarantee Fund</span>
            <h2 class="display">Backed to say yes responsibly.</h2>
            <p class="lead">AGF guarantees lending to small businesses so Brisk can serve customers traditional banks often overlook.</p>
          </div>
          <div class="agf-mark" aria-label="African Guarantee Fund">
            <strong>AGF</strong>
            <span>Pan-African support for SME growth</span>
          </div>
        </div>`
    },
    {
      chapter: "The AGF standard",
      accent: "#F86818",
      background: "#2098F0",
      duration: 11000,
      className: "agf-values",
      html: `
        <div class="scene-frame agf-values-frame">
          <div class="agf-values-head">
            <h2>Five values. One standard.</h2>
            <p>AGF’s principles become practical behaviours in every Brisk customer and partner relationship.</p>
          </div>
          <div class="standards">
            ${AGF_VALUES.map((value, index) => `
              <div class="standard-row" style="--row-color:${value.color}">
                <b>${String(index + 1).padStart(2, "0")}</b>
                <h3>${value.name}</h3>
                <p>${value.description}</p>
              </div>
            `).join("")}
          </div>
        </div>`
    },
    {
      chapter: "The decision lens",
      accent: "#2098F0",
      background: "#37B24D",
      duration: 9000,
      className: "lens",
      html: `
        <div class="scene-frame lens-frame">
          <div class="lens-number">
            <strong>5</strong>
            <span>one confident decision</span>
          </div>
          <div class="lens-copy">
            <span class="scene-kicker"><i></i> The 5 Cs of Credit</span>
            <h2 class="display">Five lenses. One complete borrower.</h2>
            <p class="lead">Use every C before answering the question that matters: will this loan be repaid?</p>
            <div class="lens-track" aria-label="The five Cs">
              ${CREDIT_CS.map(item => `<span>${item.name}</span>`).join("")}
            </div>
          </div>
        </div>`
    },
    ...CREDIT_CS.map((item, index) => ({
      chapter: `C${index + 1} · ${item.name}`,
      accent: item.accent,
      background: item.tint,
      duration: 10000,
      className: "credit-detail",
      html: `
        <div class="scene-frame credit-frame">
          <div class="credit-copy">
            <div class="credit-step"><b>${index + 1}</b> C ${index + 1} of 5</div>
            <h2 class="credit-title">${item.name}</h2>
            <p class="credit-definition">${item.definition}</p>
            <div class="brisk-way">
              <strong>THE BRISK WAY</strong>
              <p>${item.brisk}</p>
            </div>
            <p class="field-signal">${item.signal}</p>
          </div>
          <figure class="credit-visual">
            <img src="${item.image}" alt="${item.name}, one of the five Cs of credit" />
            <figcaption>Evidence first. Judgement second. Partnership always.</figcaption>
          </figure>
        </div>`
    })),
    {
      chapter: "Put it to work",
      accent: "#F86818",
      background: "#FFFFFF",
      duration: 10000,
      className: "final",
      html: `
        <div class="scene-frame final-frame">
          <div class="final-copy">
            <span class="scene-kicker"><i></i> The Brisk standard</span>
            <h2 class="display">Clarity builds trust. Trust grows wealth.</h2>
            <p class="lead">Character first. Capacity proven. Capital shared. Collateral or relationship. Conditions right.</p>
          </div>
          <div class="final-orbit" aria-label="The five Cs working together">
            <span>Ch</span>
            <span>Ca</span>
            <span>Co</span>
            <span>Cl</span>
            <span>Cn</span>
          </div>
        </div>`
    }
  ];

  const stage = document.getElementById("stage");
  const progressNav = document.getElementById("progressNav");
  const topProgress = document.getElementById("topProgress");
  const chapterName = document.getElementById("chapterName");
  const sceneCount = document.getElementById("sceneCount");
  const pauseButton = document.getElementById("pauseButton");
  const fullscreenButton = document.getElementById("fullscreenButton");

  stage.innerHTML = scenes.map((scene, index) => `
    <section
      class="scene ${scene.className}"
      style="--scene-bg:${scene.background};--scene-accent:${scene.accent}"
      aria-label="${scene.chapter}"
      aria-hidden="${index === 0 ? "false" : "true"}"
    >${scene.html}</section>
  `).join("");

  progressNav.innerHTML = scenes.map((scene, index) => `
    <button
      type="button"
      style="--dot:${scene.accent}"
      aria-label="Open scene ${index + 1}: ${scene.chapter}"
      data-index="${index}"
    >${index + 1}</button>
  `).join("");

  const sceneElements = [...stage.children];
  const progressButtons = [...progressNav.children];
  let currentIndex = 0;
  let timer = null;
  let sceneStartedAt = performance.now();
  let elapsedBeforePause = 0;
  let paused = false;
  let visibilityPaused = false;

  function scheduleNext() {
    clearTimeout(timer);
    if (paused) return;
    const remaining = Math.max(250, scenes[currentIndex].duration - elapsedBeforePause);
    timer = setTimeout(() => showScene((currentIndex + 1) % scenes.length), remaining);
  }

  function showScene(nextIndex) {
    const normalized = (nextIndex + scenes.length) % scenes.length;
    sceneElements[currentIndex].classList.remove("is-active");
    sceneElements[currentIndex].setAttribute("aria-hidden", "true");

    currentIndex = normalized;
    const scene = scenes[currentIndex];
    const element = sceneElements[currentIndex];
    element.classList.add("is-active");
    element.setAttribute("aria-hidden", "false");

    document.documentElement.style.setProperty("--accent", scene.accent);
    chapterName.textContent = scene.chapter;
    sceneCount.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${String(scenes.length).padStart(2, "0")}`;
    progressButtons.forEach((button, index) => {
      button.classList.toggle("is-active", index === currentIndex);
      button.setAttribute("aria-current", index === currentIndex ? "step" : "false");
    });

    elapsedBeforePause = 0;
    sceneStartedAt = performance.now();
    scheduleNext();
  }

  function setPaused(nextPaused) {
    if (paused === nextPaused) return;
    paused = nextPaused;

    if (paused) {
      elapsedBeforePause = Math.min(
        scenes[currentIndex].duration,
        elapsedBeforePause + performance.now() - sceneStartedAt
      );
      clearTimeout(timer);
    } else {
      sceneStartedAt = performance.now();
      scheduleNext();
    }

    pauseButton.textContent = paused ? "Resume" : "Pause";
    pauseButton.setAttribute("aria-pressed", String(paused));
  }

  function progressFrame(now) {
    const elapsed = Math.min(
      scenes[currentIndex].duration,
      elapsedBeforePause + (paused ? 0 : now - sceneStartedAt)
    );
    topProgress.style.width = `${(elapsed / scenes[currentIndex].duration) * 100}%`;
    requestAnimationFrame(progressFrame);
  }

  progressButtons.forEach(button => {
    button.addEventListener("click", () => showScene(Number(button.dataset.index)));
  });

  pauseButton.addEventListener("click", () => setPaused(!paused));

  fullscreenButton.addEventListener("click", async () => {
    if (document.fullscreenElement) {
      await document.exitFullscreen?.();
    } else {
      await document.documentElement.requestFullscreen?.();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent = document.fullscreenElement ? "Exit screen" : "Fullscreen";
  });

  document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") showScene(currentIndex + 1);
    if (event.key === "ArrowLeft") showScene(currentIndex - 1);
    if ((event.key || "").toLowerCase() === "f") fullscreenButton.click();
    if (event.code === "Space") {
      event.preventDefault();
      setPaused(!paused);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && !paused) {
      visibilityPaused = true;
      setPaused(true);
    } else if (!document.hidden && visibilityPaused) {
      visibilityPaused = false;
      setPaused(false);
    }
  });

  function updateClock() {
    const now = new Date();
    document.getElementById("clockTime").textContent =
      `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    document.getElementById("clockDate").textContent =
      now.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }).toUpperCase();
  }

  updateClock();
  setInterval(updateClock, 15000);
  showScene(0);
  requestAnimationFrame(progressFrame);
</script>
</body>
</html>
