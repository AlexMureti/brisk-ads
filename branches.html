<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brisk · Our Branches</title>
    <link rel="icon" href="favicon.png" />
    <script src="branches/gsap.min.js"></script>
    <script src="branches/map.js"></script>
    <style>
      /* Brisk branch map — looping office screen (12 s loop). Built from the "Brisk, Live" composition
         in Library/Brisk/videos/brisk-live; edit there first, then regenerate this page.
         Real data only: Kenya outline = geoBoundaries (public domain); 42 branch dots =
         the Brisk site's own branch list, placed by OpenStreetMap geocoding and grouped in
         Brisk's own 5 CBS regions; the number on screen is the site's own "42 branches".
         Silent by design: office screens play without sound. */
      @font-face { font-family: "Geist"; src: url("branches/Geist.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #03101a; cursor: none; }
      #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #03101a; color: #fff; font-family: "Geist", sans-serif; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      #glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 42% 50%, rgba(0,136,204,0.28) 0%, rgba(0,136,204,0.06) 40%, rgba(3,16,26,0) 70%); }
      #grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,136,204,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0,136,204,0.07) 1px, transparent 1px); background-size: 60px 60px; }
      svg { position: absolute; inset: 0; }
      #tag { position: absolute; left: 90px; top: 70px; font-size: 22px; font-weight: 600; letter-spacing: 0.38em; color: #7fc6ea; }
      #tag b { color: #FF7A30; }
      #side { position: absolute; left: 1300px; top: 330px; width: 560px; }
      #count { font-size: 230px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: #FF7A30; font-variant-numeric: tabular-nums; }
      #countLbl { margin-top: 34px; font-size: 44px; font-weight: 600; line-height: 1.15; }
      #region { margin-top: 44px; display: inline-flex; align-items: center; gap: 14px; padding: 14px 24px; border-radius: 999px; border: 2px solid rgba(0,136,204,0.6); background: rgba(0,136,204,0.14); font-size: 26px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #bfe6fb; min-width: 420px; }
      #region i { width: 12px; height: 12px; border-radius: 50%; background: #FF7A30; flex: none; }
      #end { position: absolute; inset: 0; background: #ffffff; }
      #end img { position: absolute; left: 50%; top: 439px; width: 900px; margin-left: -450px; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <section id="s1" class="scene clip" data-start="0" data-duration="10" data-track-index="0" data-layout-allow-overlap>
        <div id="glow"></div>
        <div id="grid"></div>
        <svg id="map" width="1920" height="1080" viewBox="0 0 1920 1080">
          <defs>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" /></filter>
          </defs>
          <g id="cam">
            <path id="kenya" fill="rgba(0,136,204,0.10)" stroke="#2aa7e6" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" />
            <g id="links"></g>
            <g id="dots"></g>
            <g id="labels"></g>
          </g>
          <rect id="miniBg" rx="18" fill="#041826" stroke="rgba(42,167,230,0.35)" stroke-width="1.5" opacity="0" />
          <g id="mini" opacity="0">
            <path id="miniKenya" fill="rgba(0,136,204,0.18)" stroke="#2aa7e6" stroke-width="1.2" vector-effect="non-scaling-stroke" />
            <rect id="miniBox" fill="none" stroke="#FF7A30" stroke-width="2" vector-effect="non-scaling-stroke" />
          </g>
        </svg>
        <p id="tag">BRISK CREDIT <b>·</b> OUR BRANCHES</p>
        <div id="side">
          <div id="count">0</div>
          <div id="countLbl">branches across Kenya</div>
          <div id="region"><i></i><span id="regionName">Nairobi South</span></div>
        </div>
      </section>

      <section id="s2" class="scene clip" data-start="8.6" data-duration="1.4" data-track-index="1">
        <div id="end">
          <img id="logo" src="branches/brisk-logo.png" alt="Brisk Credit Ltd" />
        </div>
      </section>
    </div></div>

    <script>
      // fit the 1920x1080 stage to any screen, letterboxed
      function fit() {
        var s = Math.min(innerWidth / 1920, innerHeight / 1080), st = document.getElementById("stage");
        st.style.transform = "scale(" + s + ") translate(-50%, -50%)";
      }
      addEventListener("resize", fit); fit();
      // click or F = fullscreen (same as the other screens)
      function goFS() { var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
      addEventListener("click", goFS);
      addEventListener("keydown", function (e) { if (String(e.key).toLowerCase() === "f") goFS(); });
      document.fonts.ready.then(function () {
        var tl = gsap.timeline({ repeat: -1 });
        var NS = "http://www.w3.org/2000/svg";
        var M = window.MAP;

        // ── build the map from data
        var kenya = document.getElementById("kenya");
        kenya.setAttribute("d", M.path);
        var len = kenya.getTotalLength();
        kenya.style.strokeDasharray = len;

        var ZOOM = 4.3, FX = M.focus[0], FY = M.focus[1];   // camera ends centred on central Kenya
        var dots = document.getElementById("dots"), links = document.getElementById("links"), labels = document.getElementById("labels");
        var byRegion = {}, order = [];
        M.branches.forEach(function (b) {
          if (!byRegion[b.region]) { byRegion[b.region] = []; order.push(b.region); }
          byRegion[b.region].push(b);
        });

        // one halo + one core per branch; sizes in map units (the camera scales them ~4.3x)
        M.branches.forEach(function (b, i) {
          var halo = document.createElementNS(NS, "circle");
          halo.setAttribute("cx", b.x); halo.setAttribute("cy", b.y); halo.setAttribute("r", 1.3);
          halo.setAttribute("fill", "none"); halo.setAttribute("stroke", "#FF7A30"); halo.setAttribute("stroke-width", 0.5);
          halo.setAttribute("id", "h" + i); halo.style.opacity = 0;
          var core = document.createElementNS(NS, "circle");
          core.setAttribute("cx", b.x); core.setAttribute("cy", b.y); core.setAttribute("r", 1.25);
          core.setAttribute("fill", "#FF7A30"); core.setAttribute("id", "d" + i); core.style.opacity = 0;
          dots.appendChild(halo); dots.appendChild(core);
          b.i = i;
        });

        // thin links inside each region: each branch to the region's first branch
        order.forEach(function (r) {
          var hub = byRegion[r][0];
          byRegion[r].slice(1).forEach(function (b) {
            var l = document.createElementNS(NS, "line");
            l.setAttribute("x1", hub.x); l.setAttribute("y1", hub.y); l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
            l.setAttribute("stroke", "rgba(255,122,48,0.45)"); l.setAttribute("stroke-width", 0.28);
            var d = Math.hypot(b.x - hub.x, b.y - hub.y);
            l.style.strokeDasharray = d; l.style.strokeDashoffset = d;
            l.setAttribute("id", "l" + b.i);
            links.appendChild(l);
          });
        });

        // town names for the regional branches, plus Nairobi
        var townList = [];
        M.branches.forEach(function (b) { if (M.towns[b.name]) townList.push({ x: b.x, y: b.y, t: M.towns[b.name], region: b.region }); });
        townList.push({ x: M.nairobi[0], y: M.nairobi[1], t: "NAIROBI", region: "Nairobi South", big: true });
        townList.forEach(function (tw, k) {
          var t = document.createElementNS(NS, "text");
          t.setAttribute("x", tw.big ? tw.x - 16 : tw.x + 2.3); t.setAttribute("y", tw.big ? tw.y - 12 : tw.y + 1);
          t.setAttribute("fill", tw.big ? "#ffffff" : "rgba(210,236,250,0.85)");
          t.setAttribute("font-size", tw.big ? 5.2 : 3.1); t.setAttribute("font-weight", tw.big ? 800 : 600);
          t.setAttribute("font-family", "Geist, sans-serif"); t.setAttribute("letter-spacing", tw.big ? 0.8 : 0.2);
          t.setAttribute("id", "t" + k); t.style.opacity = 0; t.textContent = tw.t;
          labels.appendChild(t); tw.k = k;
        });

        // ── inset: whole Kenya at 0.34x, bottom-left, with the camera's final view boxed
        var MS = 0.34, MTX = 70 - 596 * MS, MTY = 700 - 88 * MS;
        document.getElementById("miniKenya").setAttribute("d", M.path);
        document.getElementById("mini").setAttribute("transform", "translate(" + MTX + "," + MTY + ") scale(" + MS + ")");
        var mb = document.getElementById("miniKenya").getBBox(), pad = 22, bg = document.getElementById("miniBg");
        bg.setAttribute("x", MTX + mb.x * MS - pad); bg.setAttribute("y", MTY + mb.y * MS - pad);
        bg.setAttribute("width", mb.width * MS + pad * 2); bg.setAttribute("height", mb.height * MS + pad * 2);
        var vx = FX - 760 / ZOOM, vy = FY - 540 / ZOOM;
        var box = document.getElementById("miniBox");
        box.setAttribute("x", vx); box.setAttribute("y", vy); box.setAttribute("width", 1920 / ZOOM); box.setAttribute("height", 1080 / ZOOM);

        // ── camera: a proxy tweened on the timeline, applied as an SVG transform
        var cam = document.getElementById("cam");
        var camState = { s: 1, cx: FX, cy: FY };
        function applyCam() {
          var tx = camState.cx - camState.s * FX, ty = camState.cy - camState.s * FY;
          cam.setAttribute("transform", "translate(" + tx.toFixed(2) + "," + ty.toFixed(2) + ") scale(" + camState.s.toFixed(4) + ")");
        }
        applyCam();

        // ── timeline
        tl.fromTo("#glow", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0);
        tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: 1.2 }, 0.2);
        tl.fromTo("#tag", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.fromTo(kenya, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 0.1);
        tl.fromTo(kenya, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.8 }, 1.0);
        tl.to(camState, { s: ZOOM, cx: 760, cy: 540, duration: 1.3, ease: "power3.inOut", onUpdate: applyCam }, 1.35);
        tl.fromTo(["#mini", "#miniBg"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.4);
        tl.fromTo("#side", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 2.3);

        // regions light up in turn — the count is the dots actually lit
        var counter = { n: 0 }, countEl = document.getElementById("count"), regionEl = document.getElementById("regionName");
        var t0 = 2.6, per = 0.96, lit = 0;
        order.forEach(function (r, ri) {
          var start = t0 + ri * per, list = byRegion[r];
          tl.call(function () { regionEl.textContent = r + " · " + list.length; }, [], start);
          tl.fromTo("#region", { scale: 0.96 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }, start);
          list.forEach(function (b, k) {
            var at = start + k * (0.7 / list.length);
            tl.fromTo("#d" + b.i, { opacity: 0, attr: { r: 0.2 } }, { opacity: 1, attr: { r: 1.25 }, duration: 0.28, ease: "back.out(3)" }, at);
            tl.fromTo("#h" + b.i, { opacity: 0.9, attr: { r: 1.3 } }, { opacity: 0, attr: { r: 5.5 }, duration: 0.9, ease: "power2.out", immediateRender: false }, at);
            if (k > 0) tl.to("#l" + b.i, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at);
          });
          lit += list.length;
          tl.to(counter, { n: lit, duration: 0.7, ease: "none", onUpdate: function () { countEl.textContent = Math.round(counter.n); } }, start);
          townList.forEach(function (tw) { if (tw.region === r) tl.fromTo("#t" + tw.k, { opacity: 0 }, { opacity: 1, duration: 0.4 }, start + 0.3); });
        });

        // everything breathes once together, then the logo card wipes in
        var all = M.branches.map(function (b) { return "#h" + b.i; });
        tl.fromTo(all, { opacity: 0.8, attr: { r: 1.3 } }, { opacity: 0, attr: { r: 7 }, duration: 1.0, ease: "power2.out", immediateRender: false }, 7.6);
        tl.to(camState, { s: ZOOM * 1.06, duration: 1.2, ease: "none", onUpdate: applyCam }, 7.4);
        tl.fromTo("#end", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.55, ease: "power3.inOut" }, 8.6);
        tl.set(["#map", "#side", "#tag"], { opacity: 0 }, 9.2);
        tl.fromTo("#logo", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.95);
        tl.to({}, { duration: 2.5 }, 9.5);   // hold the logo, then loop
      });
    </script>
  </body>
</html>
