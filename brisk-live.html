<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brisk · Live</title>
    <link rel="icon" href="favicon.png" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03101a; cursor: none; }
      video { display: block; width: 100%; height: 100%; object-fit: contain; background: #03101a; }
    </style>
  </head>
  <body>
    <!-- A pre-rendered 720p loop: a TV plays video far more smoothly than it can draw the
         animation live. The animated version is brisk-live-animated.html. -->
    <video id="loop" src="brisk-live/brisk-live-720p.mp4" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
    <script>
      var v = document.getElementById("loop");
      function play() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
      function goFS() { var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); play(); }
      addEventListener("click", goFS);
      addEventListener("keydown", function (e) { if (String(e.key).toLowerCase() === "f") goFS(); });
      // a screen left running all day: if the browser ever pauses the video, start it again
      setInterval(function () { if (v.paused) play(); }, 5000);
      play();
    </script>
  </body>
</html>
